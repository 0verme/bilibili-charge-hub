name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: charge_hub_ci
          POSTGRES_USER: charge_hub
          POSTGRES_PASSWORD: charge_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U charge_hub -d charge_hub_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: DATABASE_URL=sqlite:///./ci.sqlite3 alembic upgrade head
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://charge_hub:charge_hub_test@127.0.0.1:5432/charge_hub_ci
      - run: pytest -q tests/test_postgres_integration.py
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://charge_hub:charge_hub_test@127.0.0.1:5432/charge_hub_ci
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://charge_hub:charge_hub_test@127.0.0.1:5432/charge_hub_ci
      - run: docker compose --env-file .env.example config --quiet
      - name: Prepare container smoke secrets
        run: |
          echo "APP_DOMAIN=localhost" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=container-smoke-password" >> "$GITHUB_ENV"
          echo "APP_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
      - name: Build and smoke-test the application container
        run: |
          docker compose up -d --build db app
          for attempt in $(seq 1 30); do
            if docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"; then
              docker compose exec -T app python -c "import json, urllib.request; data=json.dumps({'username':'smoke-admin','password':'container-smoke-42'}).encode(); request=urllib.request.Request('http://127.0.0.1:8000/api/auth/setup', data=data, headers={'Content-Type':'application/json'}); assert urllib.request.urlopen(request, timeout=3).status == 201"
              exit 0
            fi
            sleep 2
          done
          docker compose logs app db
          exit 1
      - name: Stop smoke-test containers
        if: always()
        run: docker compose down --volumes --remove-orphans
