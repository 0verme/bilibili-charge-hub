name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "⚠️ Breaking Changes"
    labels:
      - "breaking-change"
  - title: "✨ Features"
    labels:
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "📦 Other Changes"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: "\\<*_&"

version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "documentation"
  default: patch

prerelease: false

template: |
  ## What's Changed

  $CHANGES

  ## New Contributors

  $CONTRIBUTORS
