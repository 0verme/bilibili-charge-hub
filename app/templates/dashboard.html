<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据驾驶舱</title><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:0;background:#08111f;color:#edf5ff;font-family:system-ui}main{max-width:1200px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card,section{background:#101f33;border:1px solid #243b57;border-radius:14px;padding:16px}#trend{height:320px;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #243b57;text-align:left}.error{color:#ff8998}@media(max-width:600px){main{padding:12px}table{font-size:12px}}</style></head>
<body><main><h1>数据驾驶舱</h1><div id="state">加载中…</div><div class="cards" id="cards"></div><section id="trend"></section><section><h2>最近充电</h2><table><thead><tr><th>用户</th><th>金额</th><th>时间</th></tr></thead><tbody id="records"></tbody></table></section></main>
<script>async function load(){try{const r=await fetch('/api/dashboard');if(!r.ok)throw new Error('加载失败');const d=await r.json();state.textContent=d.records.length?'':'暂无充电数据';cards.innerHTML=Object.entries(d.summary).map(([k,v])=>`<div class="card"><small>${k}</small><h2>${v}</h2></div>`).join('');records.innerHTML=d.records.map(x=>`<tr><td>${x.name} (${x.uid})</td><td>${x.amount}</td><td>${x.charged_at}</td></tr>`).join('');echarts.init(trend).setOption({tooltip:{},xAxis:{type:'category',data:d.trend.map(x=>x.date)},yAxis:{type:'value'},series:[{type:'line',smooth:true,data:d.trend.map(x=>x.amount)}]});}catch(e){state.className='error';state.textContent=e.message}}load()</script></body></html>
