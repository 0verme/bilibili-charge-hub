<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · Bilibili Charge Hub</title><link rel="stylesheet" href="/static/app.css"></head><body><div class="shell"><aside class="sidebar"><h2>Charge Hub</h2><p id="identity" class="muted">正在验证会话…</p><nav><button data-view="overview" class="active">驾驶舱</button><button data-view="accounts">B 站账号</button><button data-view="jobs">定时任务</button><button data-view="notifications">通知中心</button><button data-view="shares">数据分享</button><button data-view="users">用户与安全</button></nav></aside><main><header class="topbar"><div><h1 id="title">驾驶舱</h1><p id="state" class="muted"></p></div><button id="logout" class="secondary">退出</button></header>
<section id="overview" class="view active"><form id="filters" class="form-grid"><select name="account_id"><option value="">全部账号</option></select><input name="search" placeholder="昵称或 UID"><input name="start" type="datetime-local"><input name="end" type="datetime-local"><input name="min_amount" type="number" step="0.01" placeholder="最低金额"><input name="max_amount" type="number" step="0.01" placeholder="最高金额"><button>筛选</button><button type="button" id="export" class="secondary">导出 CSV</button></form><div id="summary" class="grid"></div><section class="panel"><h2>趋势</h2><svg id="trend" viewBox="0 0 900 220" role="img" aria-label="充电趋势"></svg></section><section class="panel records"><h2>充电记录</h2><table><thead><tr><th>用户</th><th>金额</th><th>实际到账</th><th>时间</th></tr></thead><tbody id="records"></tbody></table><div class="toolbar"><button id="prev" class="secondary">上一页</button><span id="page"></span><button id="next" class="secondary">下一页</button></div></section></section>
<section id="accounts" class="view"><div class="toolbar"><button id="bind">扫码绑定账号</button></div><div id="qr" class="panel hidden"><h2>请使用哔哩哔哩扫码</h2><img class="qr" alt="Bilibili 登录二维码"><p class="muted"></p></div><div id="account-list" class="grid"></div></section>
<section id="jobs" class="view"><div id="job-list" class="grid"></div><section class="panel records"><h2>运行历史</h2><table><thead><tr><th>状态</th><th>任务</th><th>开始</th><th>耗时/错误</th></tr></thead><tbody id="run-list"></tbody></table></section></section>
<section id="notifications" class="view"><section class="panel"><h2>新建通知渠道</h2><form id="channel-form" class="form-grid"><input name="name" placeholder="渠道名称" required><select name="provider"><option value="feishu">飞书</option><option value="telegram">Telegram</option><option value="serverchan">Server酱</option><option value="webhook">通用 Webhook</option></select><input name="endpoint" placeholder="Webhook URL / Bot Token / SendKey" required><input name="chat_id" placeholder="Telegram Chat ID"><button>保存</button></form></section><div id="channel-list" class="grid"></div><section class="panel records"><h2>最近投递</h2><table><thead><tr><th>状态</th><th>渠道</th><th>次数</th><th>结果</th></tr></thead><tbody id="delivery-list"></tbody></table></section></section>
<section id="shares" class="view"><section class="panel"><h2>创建分享</h2><form id="share-form" class="form-grid"><input name="expires_hours" type="number" min="1" max="720" value="24"><input name="password" type="password" minlength="8" placeholder="可选密码"><button>创建并复制链接</button></form></section><div id="share-list" class="grid"></div></section>
<section id="users" class="view"><section class="panel"><h2>修改我的密码</h2><form id="password-form" class="form-grid"><input name="current_password" type="password" placeholder="当前密码" required><input name="new_password" type="password" minlength="12" placeholder="新密码（字母+数字）" required><button>修改</button></form></section><section id="admin-users" class="panel hidden"><h2>用户管理</h2><form id="user-form" class="form-grid"><input name="username" placeholder="用户名" required><input name="password" type="password" minlength="12" placeholder="初始密码" required><select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select><button>创建</button></form><div id="user-list"></div></section></section></main></div><div id="toast"></div><script src="/static/dashboard.js" defer></script></body></html>
