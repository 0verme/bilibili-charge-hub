<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置管理员密码 · Bilibili Charge Hub</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="auth panel"><p class="muted">Bilibili Charge Hub</p><h1>重置管理员密码</h1><p class="muted">输入管理员用户名、服务器配置的恢复令牌和新密码。重置后，所有该管理员的登录会话都会失效。</p><form data-endpoint="/api/auth/recover" data-confirm-field="confirm_password" data-success-message="密码已重置，请返回登录页使用新密码登录。"><label>管理员用户名<input name="username" required minlength="3" autocomplete="username"></label><label>恢复令牌<input name="recovery_token" type="password" required autocomplete="one-time-code"></label><label>新密码<input name="new_password" type="password" required autocomplete="new-password"></label><label>确认新密码<input name="confirm_password" type="password" required autocomplete="new-password"></label><button>重置密码</button><p id="message" class="muted"></p></form><p class="muted">恢复令牌由服务器环境变量 <code>ADMIN_RECOVERY_TOKEN</code> 配置。</p><p class="muted"><a href="/login">返回登录</a></p></main><script src="/static/auth.js" defer></script></body></html>
